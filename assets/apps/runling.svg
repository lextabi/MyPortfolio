<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 128 128">
  <!-- Runling app icon (Sept 2026 art pass): a winged running shoe on a sunny hill. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FAEF2"/><stop offset="0.65" stop-color="#A9DBFF"/><stop offset="1" stop-color="#FFF0CF"/>
    </linearGradient>
    <linearGradient id="shoe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA15E"/><stop offset="1" stop-color="#F06A1F"/>
    </linearGradient>
    <clipPath id="round"><rect x="4" y="4" width="120" height="120" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect x="0" y="0" width="128" height="128" fill="url(#sky)"/>
    <circle cx="96" cy="30" r="24" fill="#FFF4C2" opacity="0.35"/>
    <circle cx="96" cy="30" r="14" fill="#FFF4C2"/>
    <circle cx="30" cy="30" r="9" fill="#FFFFFF" opacity="0.9"/><circle cx="41" cy="27" r="11" fill="#FFFFFF" opacity="0.9"/><circle cx="52" cy="31" r="8" fill="#FFFFFF" opacity="0.9"/>
    <path d="M0 104 Q34 86 70 98 Q100 108 128 94 V128 H0 Z" fill="#5DAE5E"/>
    <path d="M0 112 Q40 100 80 110 Q106 116 128 108 V128 H0 Z" fill="#4E9A5B"/>
  </g>
  <!-- speed lines -->
  <path d="M14 70 H34 M10 80 H30 M16 90 H32" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <!-- wing -->
  <path d="M52 62 Q40 44 30 46 Q36 52 36 56 Q28 54 24 58 Q32 62 34 66 Q30 68 28 72 Q42 74 54 70 Z" fill="#FFFFFF" stroke="#3B2414" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- shoe -->
  <path d="M40 66 Q46 58 58 58 L70 60 Q76 70 88 72 L104 76 Q112 79 110 88 L108 92 H42 Q36 80 40 66 Z" fill="url(#shoe)" stroke="#3B2414" stroke-width="3" stroke-linejoin="round"/>
  <path d="M42 92 H108 Q110 98 104 100 H46 Q40 99 42 92 Z" fill="#FFF6E2" stroke="#3B2414" stroke-width="3" stroke-linejoin="round"/>
  <path d="M60 66 l6 5 M68 68 l6 5 M76 71 l5 4" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
  <path d="M50 84 Q72 80 100 86" fill="none" stroke="#FFD166" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="none" stroke="#B98535" stroke-width="3"/>
</svg>
