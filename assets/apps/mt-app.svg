<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- MT App logo "Rising M": an M drawn as a rising trend line, plus a
       gold coin. Source for every icon; Android's adaptive icon repeats
       these paths in res/drawable/ic_launcher_*.xml. -->
  <defs>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#0F5F59"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE08A"/><stop offset="1" stop-color="#F2A516"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#teal)"/>
  <rect width="512" height="512" rx="116" fill="url(#gloss)"/>
  <g fill="none" stroke="#fff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round">
    <path d="M118 372 V178 L232 300 L312 214 L380 150"/>
    <path d="M300 138 H392 V230"/>
  </g>
  <circle cx="372" cy="360" r="42" fill="url(#gold)"/>
</svg>
